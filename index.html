function genStringScatter(src,N){const nu=n=>N?numMagic(n):String(n);return src.replace(/"([^"\\]{1,40})"/g,(match,s)=>{if(s.length<3)return match;const bytes=strToBytes(s);const parts=bytes.map((b)=>{const v=rndName(5);return`(function()local ${v}=${nu(b)};return ${v} end)()`});const sc=rndName(5);return`(function()local ${sc}=string.char;return ${sc}(${parts.join(',')})end)()`})}

function genDeepFunctionWrap(src,N){const nu=n=>N?numMagic(n):String(n);const depth=3;let result=src;for(let i=0;i<depth;i++){const vA=rndName(6),vB=rndName(6);result=`(function()\nlocal ${vA}=${nu(ri(1,100))};local ${vB}=${nu(ri(1,100))};\n${result}\nend)()`}return result}

// ══ V10 (safe versions) ══
function genGarbageFlood(N){
  // Giới hạn an toàn: 50 entries thay vì 200-1000
  const nu=n=>N?numMagic(n):String(n);
  const count=50;
  let code='';
  const tpls=[
    ()=>{const fn=rndName(10),a=rndName(6),b=rndName(6),r=rndName(6);return`local function ${fn}(${a},${b})\nlocal ${r}=${nu(0)}\nfor _=1,${nu(0)} do ${r}=${r}+${a}*${b} end\nreturn ${r}\nend\n`},
    ()=>{const tn=rndName(10),k1=rndName(6),k2=rndName(6);return`local ${tn}={${k1}=${nu(ri(0,999))},${k2}=${nu(ri(0,999))}}\n`},
    ()=>{const v=rndName(10);return`local ${v}=${nu(ri(1,100))}+${nu(ri(1,50))}-${nu(ri(1,30))}\n`},
  ];
  for(let i=0;i<count;i++)code+=tpls[ri(0,tpls.length-1)]();
  return code;
}

function genTrapChain(N){
  const nu=n=>N?numMagic(n):String(n);
  const trapCount=5;
  let code='';
  const trapVars=[...Array(trapCount)].map(()=>rndName(8));
  for(const v of trapVars)code+=`local ${v}=true\n`;
  for(let i=1;i<trapCount;i++){
    const checker=rndName(8),loopV=rndName(6);
    code+=`local ${checker}=${trapVars[i-1]} and ${opaqueTrue()}\n`;
    code+=`if not ${checker} then\n${trapVars[i]}=false\nlocal ${loopV}=true;while ${loopV} do end\nend\n`;
  }
  const finalV=rndName(8),loopFinal=rndName(6);
  code+=`local ${finalV}=true\n`;
  for(const v of trapVars)code+=`${finalV}=${finalV} and ${v}\n`;
  code+=`if not ${finalV} then\nlocal ${loopFinal}=true;while ${loopFinal} do end\nend\n`;
  return code;
}

function genTableObfProxy(N){
  const nu=n=>N?numMagic(n):String(n);
  const pName=rndName(10),rawg=rndName(8),raws=rndName(8);
  const idx=rndName(6),val=rndName(6),tbl=rndName(6),jv=rndName(6);
  let code='';
  code+=`local ${rawg}=rawget\nlocal ${raws}=rawset\n`;
  code+=`local function ${pName}(${tbl},${idx},${val})\nif ${val}~=nil then return ${raws}(${tbl},${idx},${val})\nelse\nlocal ${jv}=${nu(ri(1,100))}\nif ${opaqueFalse()} then return ${jv} end\nreturn ${rawg}(${tbl},${idx})\nend\nend\n`;
  return code;
}

function genCallRedirect(N){
  const nu=n=>N?numMagic(n):String(n);
  const dispN=rndName(10),fnV=rndName(6);
  const jv1=rndName(6);
  let code='';
  code+=`local function ${dispN}(${fnV},...)\nlocal ${jv1}=${nu(ri(1,50))}\nif ${opaqueFalse()} then return ${jv1} end\nreturn ${fnV}(...)\nend\n`;
  return code;
}

function genPolymorphicLayer(src,N){
  const nu=n=>N?numMagic(n):String(n);
  const bytes=strToBytes(src);
  const baseSalt=ri(50,200);
  const encoded=bytes.map((b,i)=>(b^((baseSalt+i*7)%256)));
  const encV=rndName(8),outV=rndName(8),iV=rndName(5),bV=rndName(5),scV=rndName(6),lsV=rndName(6),fnV=rndName(6),erV=rndName(6),saltV=rndName(8);
  const lines=[];
  for(let i=0;i<encoded.length;i+=16)lines.push(encoded.slice(i,i+16).map(nu).join(','));
  const fmtd='{\n'+lines.join(',\n')+'\n}';
  let code='';
  code+=`local ${saltV}=${nu(baseSalt)}\n`;
  code+=`local ${encV}=${fmtd}\n`;
  code+=`local ${outV}=""\nlocal ${scV}=string.char\n`;
  code+=`for ${iV}=${nu(1)},#${encV} do\nlocal ${bV}=${encV}[${iV}]\n${bV}=${bV}~((${saltV}+(${iV}-${nu(1)})*${nu(7)})%${nu(256)})\n${outV}=${outV}..${scV}(${bV})\nend\n`;
  code+=`local ${lsV}=loadstring or load\nlocal ${fnV},${erV}=${lsV}(${outV})\nassert(${fnV},"hienvip decompression error: "..(${erV} or "?").." (does your environment support load/loadstring?)")\n${fnV}()\n`;
  return{code,layers:3,keys:2}
}

function genMutationNoise(N){
  const nu=n=>N?numMagic(n):String(n);
  let code='';
  for(let i=0;i<15;i++){const v=rndName(ri(8,14));code+=`local ${v}=${nu(ri(0,999999))}\n`}
  return code;
}



// ══ BASE64 OUTER LAYER ══
function toBase64Lua(src){
  var ch='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  var bytes=strToBytes(src),b64='';
  for(var i=0;i<bytes.length;i+=3){
    var b0=bytes[i],b1=bytes[i+1]||0,b2=bytes[i+2]||0;
    b64+=ch[b0>>2];
    b64+=ch[((b0&3)<<4)|(b1>>4)];
    b64+=i+1<bytes.length?ch[((b1&15)<<2)|(b2>>6)]:'=';
    b64+=i+2<bytes.length?ch[b2&63]:'=';
  }
  return b64;
}

function genBase64Layer(src,N){
  var nu=function(n){return N?numMagic(n):String(n);};
  var b64=toBase64Lua(src);
  var vSC=rndName(6),vLook=rndName(8),vTbl=rndName(8),vI=rndName(5);
  var vB64=rndName(8),vDec=rndName(8),vOut=rndName(8),vN=rndName(5);
  var vLS=rndName(6),vFn=rndName(6),vEr=rndName(6);

  // Build lookup table bytes
  var chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  var cBytes=strToBytes(chars);
  var cLines=[];
  for(var ci=0;ci<cBytes.length;ci+=16)
    cLines.push(cBytes.slice(ci,ci+16).map(function(x){return nu(x);}).join(','));

  // Split b64 thành chunks 80 chars
  var chunks=[];
  for(var bi=0;bi<b64.length;bi+=80) chunks.push('"'+b64.slice(bi,bi+80)+'"');
  var b64str=chunks.join('..');

  var code='';
  code+='local '+vSC+'=string.char\n';
  code+='local '+vLook+'={}\n';
  code+='local '+vTbl+'={\n'+cLines.join(',\n')+'\n}\n';
  code+='for '+vI+'='+nu(1)+',#'+vTbl+' do\n';
  code+='  '+vLook+'['+vSC+'('+vTbl+'['+vI+'])]='+'('+vI+'-'+nu(1)+')\n';
  code+='end\n';
  code+='local '+vB64+'='+b64str+'\n';
  code+='local function '+vDec+'(s)\n';
  code+='  local '+vOut+'=""\n';
  code+='  local '+vN+'=#s\n';
  code+='  for '+vI+'='+nu(1)+','+vN+','+nu(4)+' do\n';
  code+='    local a=('+vLook+'[s:sub('+vI+','+vI+')] or '+nu(0)+')\n';
  code+='    local b=('+vLook+'[s:sub('+vI+'+'+nu(1)+','+vI+'+'+nu(1)+')] or '+nu(0)+')\n';
  code+='    local c=('+vLook+'[s:sub('+vI+'+'+nu(2)+','+vI+'+'+nu(2)+')] or '+nu(0)+')\n';
  code+='    local d=('+vLook+'[s:sub('+vI+'+'+nu(3)+','+vI+'+'+nu(3)+')] or '+nu(0)+')\n';
  code+='    local n=(a*'+nu(262144)+')+(b*'+nu(4096)+')+(c*'+nu(64)+')+d\n';
  code+='    '+vOut+'='+vOut+'..'+vSC+'(math.floor((n/'+nu(65536)+')%'+nu(256)+'))\n';
  code+='    if s:sub('+vI+'+'+nu(2)+','+vI+'+'+nu(2)+')"=" then\n';
  code+='      '+vOut+'='+vOut+'..'+vSC+'(math.floor((n/'+nu(256)+')%'+nu(256)+'))\n';
  code+='    end\n';
  code+='    if s:sub('+vI+'+'+nu(3)+','+vI+'+'+nu(3)+')"=" then\n';
  code+='      '+vOut+'='+vOut+'..'+vSC+'(math.floor(n%'+nu(256)+'))\n';
  code+='    end\n';
  code+='  end\n';
  code+='  return '+vOut+'\n';
  code+='end\n';
  code+='local '+vLS+'=loadstring or load\n';
  code+='local '+vFn+','+vEr+'='+vLS+'('+vDec+'('+vB64+'))\n';
  code+='assert('+vFn+' and type('+vFn+')=="function","hienvip decompression error: "..('+vEr+' or "?").." (does your environment support load/loadstring?)")\n';
  code+=vFn+'()\n';
  return {code:code,layers:2,keys:0};
}

// ══ MAIN ══
function showN(m){const n=document.getElementById('notif');n.textContent=m;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2800)}
function clearAll(){document.getElementById('inp').value='';document.getElementById('out').value='';document.getElementById('sts').style.display='none'}

function obfuscate(){
  const input=document.getElementById('inp').value.trim();
  if(!input){showN('Vui lòng nhập code!');return}

  // Tất cả MAX — cố định
  const N=true; // numMagic on
  const jlv=5;  // junk level
  const wlv=2;  // wrap layers
  const origSz=input.length;
  let tL=0,tK=0,tW=0;

  document.getElementById('prog').classList.add('show');
  const sp=(p,m)=>{document.getElementById('pbar').style.width=p+'%';document.getElementById('ptxt').textContent=m.toUpperCase()};

  function finish(final){
    sp(100,'HOÀN THÀNH!');
    const hdr=`-- This file was created by ${_T} v10.0\n-- Discord: ${_D}\n\n`;
    const out=hdr+final;
    setTimeout(()=>{
      document.getElementById('out').value=out;
      document.getElementById('prog').classList.remove('show');
      const inc=Math.round(((out.length-origSz)/origSz)*100);
      document.getElementById('s_b').textContent=out.length.toLocaleString();
      document.getElementById('s_l').textContent=tL;
      document.getElementById('s_w').textContent=tW;
      document.getElementById('s_z').textContent='+'+inc+'%';
      document.getElementById('s_k').textContent=tK;
      document.getElementById('sts').style.display='flex';
      showN('ULTRA OBFUSCATE V10 THÀNH CÔNG!');
    },400);
  }

  setTimeout(()=>{
    try{
      sp(3,'Phân tích...');
      let code=input;

      // Rename
      sp(5,'Rename...');
      const kw=new Set(['true','false','nil','and','or','not','if','then','else','elseif','end','do','while','repeat','until','for','in','function','local','return','break','self','game','workspace','script','require','wait','spawn','delay','print','warn','error','task','pcall','xpcall','pairs','ipairs','tostring','tonumber','type','math','string','table','os','coroutine','select','unpack','rawget','rawset','setmetatable','getmetatable','bit32','Instance','Color3','Vector2','Vector3','UDim','UDim2','TweenInfo','Enum','Players','HttpGet','loadstring','HttpService','RunService','TweenService','_G','_ENV','getfenv','load']);
      const vm={};const re=/\blocal\s+(?:function\s+)?([a-zA-Z_][a-zA-Z0-9_]*)\b/g;let mm;
      while((mm=re.exec(input))!==null){const n=mm[1];if(!vm[n]&&!kw.has(n))vm[n]=rndName(14)}
      for(const[orig,obfd] of Object.entries(vm)){try{code=code.replace(new RegExp('\\b'+orig+'\\b','g'),obfd)}catch(e){}}
      tL++;

      // Proxy
      sp(10,'Proxy...');
      let ph='';
      const pm={print:rndName(12),warn:rndName(12),pcall:rndName(12),error:rndName(12),task:rndName(12),pairs:rndName(12),ipairs:rndName(12)};
      for(const[k,v] of Object.entries(pm))ph+=`local ${v}=${k}\n`;
      for(const[k,v] of Object.entries(pm)){try{code=code.replace(new RegExp('\\b'+k+'\\b','g'),v)}catch(e){}}
      tL++;

      // String Scatter
      sp(13,'String Scatter...');
      code=genStringScatter(code,N);tL++;

      // Junk + helpers
      sp(16,'Junk...');
      const junk=genJunk(jlv,N);tL++;
      const ad=genAntiDump();tL++;
      const ff=genFakeFlow(N);tL++;
      const wm=`local ${rndName(10)}={${strToBytes('hienvip_v10').map(c=>N?numMagic(c):c).join(',')}}\n`;

      // Env Lock + Anti Debug
      sp(20,'Env Lock...');
      const envLock=genEnvLock(N);tL++;
      sp(23,'Anti-Debug...');
      const antiDbg=genAntiDebug(N);tL++;

      // V10
      sp(26,'Garbage Flood...');
      const garbage=genGarbageFlood(N);tL+=2;
      sp(30,'Trap Chain...');
      const trapChain=genTrapChain(N);tL+=2;
      sp(33,'Table Obf...');
      const tableProxy=genTableObfProxy(N);tL++;
      sp(36,'Call Redirect...');
      const callRedir=genCallRedirect(N);tL++;
      sp(39,'Mutation...');
      const mutNoise=genMutationNoise(N);tL++;

      sp(42,'Assemble...');
      let inner=mutNoise+garbage+envLock+antiDbg+trapChain+tableProxy+callRedir+ad+ph+junk+ff+code;

      // Deep wrap + flow
      sp(46,'Function Wrap...');
      inner=genDeepFunctionWrap(inner,N);tL++;
      sp(50,'Flow Flatten...');
      inner=genStateMachineWrapper(inner,N);tL++;
      inner=`local ${rndName(8)}=${opaqueTrue()} and true or false\n`+inner;tL++;

      // VM
      sp(55,'VM Layer...');
      const vmR=genVMLayer(inner,N);
      inner=vmR.code;tL+=vmR.layers;tK+=vmR.keys;

      // Polymorphic
      sp(62,'Polymorphic...');
      const pr=genPolymorphicLayer(inner,N);
      inner=pr.code;tL+=pr.layers;tK+=pr.keys;

      // XOR Multi-layer
      sp(65,'Encrypting...');
      let cur=inner;
      tW=wlv;
      for(let w=0;w<wlv;w++){
        sp(65+Math.floor(w/wlv*25),`XOR Wrap ${w+1}/${wlv}...`);
        const r=buildLayer(cur,N);
        cur=r.code;tL+=r.layers;tK+=r.keys;
      }

      sp(95,'Base64 Layer...');
      const b64r = genBase64Layer(wm+cur, N);
      tL += b64r.layers;
      sp(98,'Final...');
      finish(b64r.code);

    }catch(err){
      document.getElementById('prog').classList.remove('show');
      document.getElementById('out').value='-- Lỗi: '+err.message;
      showN('LỖI: '+err.message);
    }
  },150);
}
